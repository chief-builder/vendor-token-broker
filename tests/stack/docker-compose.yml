# Self-contained acceptance stack: OpenBao (+ one-shot init), Redis,
# mock-vendor (hostile GitHub-class AS), hub-stub (JWKS, token mint, OIDC login), and
# the broker under test. No dependency on any external lab.
#
#   docker compose -f tests/stack/docker-compose.yml up -d --build
#   pytest tests/integration
#
# The `multi` profile (defined in this file) adds broker-a/b behind a
# round-robin nginx for the multi-replica proof.
# The `gateway` profile adds Keycloak as a real hub plus a broker that
# trusts it (own OpenBao, so its sweeper never shares custody with `broker`).
#
# TEST-ONLY CREDENTIALS: every token, secret, and password in this file and in
# keycloak/mcp-realm.json (root, vtb-dev-broker-token, mock-secret,
# hub-login-secret, gateway-dev-secret, admin/admin, alice/alice, bob/bob) is
# a fixed local-stack value that protects nothing. Never reuse them.
#
# One stack per Docker host: container names (vtb-*) and host ports are fixed,
# and tests find containers by those names. The explicit project name makes
# the stack easy to spot (`docker compose ls`) whichever directory it ran from.
name: vtb

services:
  openbao:
    image: openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    container_name: vtb-openbao
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    cap_add: ["IPC_LOCK"]
    ports:
      - "8210:8200"

  openbao-init:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    container_name: vtb-openbao-init
    depends_on:
      - openbao
    environment: &openbao-init-env
      BAO_ADDR: http://openbao:8200
      BAO_ROOT_TOKEN: root
      BROKER_VAULT_TOKEN: ${BROKER_VAULT_TOKEN:-vtb-dev-broker-token}
      MOCK_CLIENT_ID: ${MOCK_CLIENT_ID:-mcp-lab-broker}
      MOCK_CLIENT_SECRET: ${MOCK_CLIENT_SECRET:-mock-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
      CLOUDFLARE_CLIENT_ID: ${CLOUDFLARE_CLIENT_ID:-}
      CLOUDFLARE_CLIENT_SECRET: ${CLOUDFLARE_CLIENT_SECRET:-}
      MOCK_JWT_CLIENT_ID: ${MOCK_JWT_CLIENT_ID:-mcp-lab-broker-jwt}
    volumes:
      - ./openbao-init/init.sh:/init.sh:ro
      - ./keys:/keys:ro
    entrypoint: ["sh", "/init.sh"]

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: vtb-redis
    ports:
      - "6390:6379"

  mock-vendor:
    build:
      context: ../..
      dockerfile: tests/stack/mock-vendor/Dockerfile
    container_name: vtb-mock-vendor
    environment:
      MOCK_PUBLIC_URL: http://localhost:8310
      MOCK_INTERNAL_URL: http://mock-vendor:8310
      MOCK_CLIENT_ID: ${MOCK_CLIENT_ID:-mcp-lab-broker}
      MOCK_CLIENT_SECRET: ${MOCK_CLIENT_SECRET:-mock-secret}
      MOCK_JWT_CLIENT_ID: ${MOCK_JWT_CLIENT_ID:-mcp-lab-broker-jwt}
      MOCK_JWT_PUBLIC_KEY_FILE: /keys/mockhub-jwt-public.pem
      MOCK_AT_TTL: "60"
    volumes:
      - ./keys/mockhub-jwt-public.pem:/keys/mockhub-jwt-public.pem:ro
    ports:
      - "8310:8310"

  hub-stub:
    build:
      context: ../..
      dockerfile: tests/stack/hub-stub/Dockerfile
    container_name: vtb-hub-stub
    environment:
      HUB_STUB_ISSUER: http://hub-stub:8320
      HUB_STUB_PUBLIC_URL: http://localhost:8320
      HUB_STUB_LOGIN_CLIENT_ID: vtb-broker
      HUB_STUB_LOGIN_CLIENT_SECRET: ${HUB_LOGIN_CLIENT_SECRET:-hub-login-secret}
    ports:
      - "8320:8320"

  broker:
    build:
      context: ../..
    container_name: vtb-broker
    environment:
      HUB_ISSUER: http://hub-stub:8320
      HUB_JWKS_URI: http://hub-stub:8320/jwks
      HUB_LOGIN_CLIENT_ID: vtb-broker
      HUB_LOGIN_CLIENT_SECRET: ${HUB_LOGIN_CLIENT_SECRET:-hub-login-secret}
      BROKER_PUBLIC_URL: http://localhost:8300
      VAULT_ADDR: http://openbao:8200
      VAULT_TOKEN: ${BROKER_VAULT_TOKEN:-vtb-dev-broker-token}
      REGISTRY_PATH: /app/registry.json
      COORD_BACKEND: ${COORD_BACKEND:-memory}
      REDIS_URL: redis://redis:6379/0
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      CLOUDFLARE_CLIENT_ID: ${CLOUDFLARE_CLIENT_ID:-}
      # Short per-replica cache so test_cache.py can observe expiry quickly.
      CACHE_TTL_S: "10"
    volumes:
      - ../../registry.example.json:/app/registry.json:ro
    ports:
      - "8300:8300"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      openbao-init:
        condition: service_completed_successfully
      mock-vendor:
        condition: service_started
      hub-stub:
        condition: service_started
      redis:
        condition: service_started

  # ---- multi profile: two redis-coordinated replicas behind round-robin ----
  # docker compose -f tests/stack/docker-compose.yml --profile multi up -d --build
  # BROKER_URL=http://localhost:8400 BROKER_CONTAINERS=vtb-broker-a,vtb-broker-b \
  #   pytest tests/integration -m multi
  broker-a:
    build:
      context: ../..
    container_name: vtb-broker-a
    profiles: ["multi"]
    environment: &replica-env
      HUB_ISSUER: http://hub-stub:8320
      HUB_JWKS_URI: http://hub-stub:8320/jwks
      HUB_LOGIN_CLIENT_ID: vtb-broker
      HUB_LOGIN_CLIENT_SECRET: ${HUB_LOGIN_CLIENT_SECRET:-hub-login-secret}
      BROKER_PUBLIC_URL: http://localhost:8400
      VAULT_ADDR: http://openbao:8200
      VAULT_TOKEN: ${BROKER_VAULT_TOKEN:-vtb-dev-broker-token}
      REGISTRY_PATH: /app/registry.json
      COORD_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      # Tightened TTLs so the death/takeover proofs run in test time.
      SWEEP_INTERVAL_S: "5"
      LOCK_TTL_MS: "4000"
      REFRESHING_TTL_S: "8"
      # LOCK_TTL_MS must cover VENDOR_TIMEOUT_S + 2 x VAULT_TIMEOUT_S.
      VENDOR_TIMEOUT_S: "2"
      VAULT_TIMEOUT_S: "1"
    volumes:
      - ../../registry.example.json:/app/registry.json:ro
    ports:
      - "8401:8300"   # direct replica access: the cross-replica tests need
    depends_on:        # to pin which replica handles which leg
      openbao-init:
        condition: service_completed_successfully
      mock-vendor:
        condition: service_started
      hub-stub:
        condition: service_started
      redis:
        condition: service_started

  broker-b:
    build:
      context: ../..
    container_name: vtb-broker-b
    profiles: ["multi"]
    environment: *replica-env
    volumes:
      - ../../registry.example.json:/app/registry.json:ro
    ports:
      - "8402:8300"
    depends_on:
      openbao-init:
        condition: service_completed_successfully
      mock-vendor:
        condition: service_started
      hub-stub:
        condition: service_started
      redis:
        condition: service_started

  broker-lb:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    container_name: vtb-broker-lb
    profiles: ["multi"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8400:8400"
    depends_on:
      - broker-a
      - broker-b

  # ---- gateway profile: Keycloak as the real hub (MCP authorization server,
  # RFC 8693 token exchange) and a broker that trusts it.
  # docker compose -f tests/stack/docker-compose.yml --profile gateway up -d --build --wait
  # pytest tests/integration -m gateway
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    container_name: vtb-keycloak
    profiles: ["gateway"]
    # Public issuer http://localhost:8180 for browsers and MCP clients (Claude
    # Code only sends credentials over plain http to exactly localhost);
    # containers reach it as http://keycloak:8180, and backchannel-dynamic
    # hands them internal token/JWKS endpoints. Tokens always carry the
    # public issuer.
    command: ["start-dev", "--import-realm", "--http-port=8180",
              "--hostname=http://localhost:8180", "--hostname-backchannel-dynamic=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

  openbao-kc:
    image: openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    container_name: vtb-openbao-kc
    profiles: ["gateway"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    cap_add: ["IPC_LOCK"]
    ports:
      - "8211:8200"

  openbao-kc-init:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    container_name: vtb-openbao-kc-init
    profiles: ["gateway"]
    depends_on:
      - openbao-kc
    environment:
      <<: *openbao-init-env
      BAO_ADDR: http://openbao-kc:8200
    volumes:
      - ./openbao-init/init.sh:/init.sh:ro
      - ./keys:/keys:ro
    entrypoint: ["sh", "/init.sh"]

  broker-kc:
    build:
      context: ../..
    container_name: vtb-broker-kc
    profiles: ["gateway"]
    environment:
      HUB_ISSUER: http://localhost:8180/realms/mcp
      HUB_JWKS_URI: http://keycloak:8180/realms/mcp/protocol/openid-connect/certs
      HUB_DISCOVERY_URL: http://keycloak:8180/realms/mcp/.well-known/openid-configuration
      HUB_LOGIN_CLIENT_ID: vtb-broker
      HUB_LOGIN_CLIENT_SECRET: hub-login-secret
      HUB_LOGIN_HINT: none
      BROKER_PUBLIC_URL: http://localhost:8600
      VAULT_ADDR: http://openbao-kc:8200
      VAULT_TOKEN: ${BROKER_VAULT_TOKEN:-vtb-dev-broker-token}
      REGISTRY_PATH: /app/registry.json
      COORD_BACKEND: memory
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      CLOUDFLARE_CLIENT_ID: ${CLOUDFLARE_CLIENT_ID:-}
    volumes:
      - ../../registry.example.json:/app/registry.json:ro
    ports:
      - "8600:8300"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      keycloak:
        condition: service_healthy
      openbao-kc-init:
        condition: service_completed_successfully
      mock-vendor:
        condition: service_started

  # Stand-ins for vendor MCP servers (/github/mcp, /linear/mcp): accept only
  # live mockhub tokens.
  mock-mcp:
    build:
      context: ../..
      dockerfile: tests/stack/mock-mcp/Dockerfile
    container_name: vtb-mock-mcp
    profiles: ["gateway"]
    environment:
      MOCK_VENDOR_URL: http://mock-vendor:8310
    ports:
      - "8330:8330"
    depends_on:
      mock-vendor:
        condition: service_started

  mcp-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.gateway
    container_name: vtb-mcp-gateway
    profiles: ["gateway"]
    environment:
      GATEWAY_PUBLIC_URL: http://localhost:8500
      HUB_ISSUER: http://localhost:8180/realms/mcp
      HUB_JWKS_URI: http://keycloak:8180/realms/mcp/protocol/openid-connect/certs
      HUB_TOKEN_ENDPOINT: http://keycloak:8180/realms/mcp/protocol/openid-connect/token
      GATEWAY_CLIENT_ID: mcp-gateway
      GATEWAY_CLIENT_SECRET: gateway-dev-secret
      BROKER_URL: http://broker-kc:8300
      # Stand-ins by default. For the real servers (needs their OAuth apps),
      # set GATEWAY_UPSTREAMS= (empty): the gateway's bundled upstreams.json.
      # GATEWAY_ENABLED_UPSTREAMS=github limits which servers are served.
      GATEWAY_UPSTREAMS: ${GATEWAY_UPSTREAMS-/config/stand-in-upstreams.json}
      GATEWAY_ENABLED_UPSTREAMS: ${GATEWAY_ENABLED_UPSTREAMS:-}
      # Short, so "accepted but never finished" runs in test time.
      # Manual runs (a person in the browser): GATEWAY_CONSENT_WAIT_S=120.
      CONSENT_WAIT_S: ${GATEWAY_CONSENT_WAIT_S:-15}
      # Short, so paused-dependency tests fail over quickly. Real servers can
      # take longer (Linear's list_issues > 5s): GATEWAY_HTTP_TIMEOUT_S=15.
      HTTP_TIMEOUT_S: ${GATEWAY_HTTP_TIMEOUT_S:-5}
    volumes:
      - ./gateway/stand-in-upstreams.json:/config/stand-in-upstreams.json:ro
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8500/.well-known/oauth-protected-resource/mcp').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      broker-kc:
        condition: service_healthy
      mock-mcp:
        condition: service_started
