# Round-robin over the two broker replicas — deliberately NO session
# affinity: consent may authorize on A and call back on B, resolves for one
# sub land on both. That's the point of the multi-replica proof.
events {}

http {
  upstream brokers {
    server broker-a:8300;
    server broker-b:8300;
  }

  server {
    listen 8400;

    location / {
      proxy_pass http://brokers;
      proxy_set_header Host $host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
    }
  }
}
