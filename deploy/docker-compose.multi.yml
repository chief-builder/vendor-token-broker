# Multi-replica deployment shape (COORD_BACKEND=redis): two broker replicas
# sharing OpenBao custody and Redis coordination. Put any L4/L7 balancer in
# front (no session affinity needed; docs/design.md §14) and set
# BROKER_PUBLIC_URL to its public https URL.
#
# Same files as docker-compose.yml: .env (every variable reaches both
# replicas), registry.json, and broker-vault-token readable by UID 65534.

services:
  redis:
    image: redis:8.10.1-alpine@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79

  broker-a: &replica
    build: ..
    env_file: .env
    environment:
      # Fixed for this shape; they override any value in .env.
      VAULT_TOKEN_FILE: /run/secrets/broker-vault-token
      REGISTRY_PATH: /app/registry.json
      COORD_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./registry.json:/app/registry.json:ro
    secrets:
      - broker-vault-token
    depends_on:
      - redis

  broker-b: *replica

secrets:
  broker-vault-token:
    file: ./broker-vault-token
