name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, format, types, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install PYTHON=python
      - run: make lint
      - run: make typecheck
      - name: Generated docs are current and their anchors resolve
        run: make docs

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: pip-audit over every lock
        run: |
          for lock in requirements.lock requirements-gateway.lock requirements-dev.lock; do
            pipx run pip-audit==2.10.1 --require-hashes --disable-pip -r "$lock"
          done

  unit:
    name: unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make test PYTHON=python
      - name: Coverage summary
        if: always()
        run: |
          .venv/bin/coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  build:
    name: wheel + images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make build PYTHON=python

  links:
    name: link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml --no-progress
            README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md THREAT_MODEL.md CLAUDE.md AUDIT.md
            'docs/**/*.md'
          fail: true
          token: ${{ github.token }}

  integration:
    name: integration (${{ matrix.coord }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        coord: [memory, redis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install PYTHON=python
      - name: Start the acceptance stack
        run: COORD_BACKEND=${{ matrix.coord }} docker compose -f tests/stack/docker-compose.yml up -d --build --wait
      - run: make test-integration
      - name: Broker logs on failure
        if: failure()
        run: docker logs vtb-broker 2>&1 | tail -200

  gateway:
    name: gateway (Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install PYTHON=python
      - name: Start the stack with Keycloak as the hub
        run: make stack-up
      - run: make test-gateway
      - name: Keycloak and broker-kc logs on failure
        if: failure()
        run: |
          docker logs vtb-keycloak 2>&1 | tail -100
          docker logs vtb-broker-kc 2>&1 | tail -100

  multi:
    name: multi-replica
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install PYTHON=python
      - run: make test-multi
      - name: Replica logs on failure
        if: failure()
        run: |
          docker logs vtb-broker-a 2>&1 | tail -100
          docker logs vtb-broker-b 2>&1 | tail -100
