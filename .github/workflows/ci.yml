name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check src tests
      - name: Validate registry example against the normative schema
        run: |
          python - <<'EOF'
          import json, jsonschema
          schema = json.load(open("schemas/vendor-registry.schema.json"))
          registry = json.load(open("registry.example.json"))
          jsonschema.validate(registry, schema)
          print("registry.example.json: schema-valid")
          EOF
      - name: Check generated documentation
        run: python tools/build-pages.py --check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest tests/unit -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t vendor-token-broker:ci .
      - run: docker build -f Dockerfile.gateway -t vtb-mcp-gateway:ci .

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coord: [memory, redis]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - name: Start the acceptance stack
        run: COORD_BACKEND=${{ matrix.coord }} docker compose -f tests/stack/docker-compose.yml up -d --build --wait
      - run: pytest tests/integration -q -m "not external and not multi and not gateway"
      - name: Broker logs on failure
        if: failure()
        run: docker logs vtb-broker 2>&1 | tail -200

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - name: Start the stack with Keycloak as the hub
        run: docker compose -f tests/stack/docker-compose.yml --profile gateway up -d --build --wait
      - run: pytest tests/integration -q -m gateway
      - name: Keycloak and broker-kc logs on failure
        if: failure()
        run: |
          docker logs vtb-keycloak 2>&1 | tail -100
          docker logs vtb-broker-kc 2>&1 | tail -100

  multi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - name: Start the multi-replica stack
        run: docker compose -f tests/stack/docker-compose.yml --profile multi up -d --build --wait
      - run: pytest tests/integration/test_multi_replica.py -q
        env:
          BROKER_URL: http://localhost:8400
          BROKER_CONTAINERS: vtb-broker-a,vtb-broker-b
      - name: Replica logs on failure
        if: failure()
        run: |
          docker logs vtb-broker-a 2>&1 | tail -100
          docker logs vtb-broker-b 2>&1 | tail -100
