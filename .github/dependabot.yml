# The hash-pinned requirements*.lock files are generated by `uv pip compile`
# (make lock), which Dependabot cannot update; CI's `audit` job runs
# pip-audit over them on every push and PR instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # let fresh releases settle first
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # let fresh releases settle first
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: docker
    directories:
      - /
      - /tests/stack/hub-stub
      - /tests/stack/mock-mcp
      - /tests/stack/mock-vendor
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # let fresh releases settle first
    groups:
      base-images: { patterns: ["*"] }

  - package-ecosystem: docker-compose
    directories:
      - /tests/stack
      - /deploy
    ignore:
      # nginx's odd minor versions are mainline; the stack tracks the stable
      # line (1.30.x). Stable patches still come; move to the next stable
      # line (1.32) by hand.
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # let fresh releases settle first
    groups:
      stack-images: { patterns: ["*"] }
