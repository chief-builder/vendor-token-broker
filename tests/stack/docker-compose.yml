# Self-contained acceptance stack: OpenBao (+ one-shot init), Redis,
# mock-vendor (hostile GitHub-class AS), hub-stub (JWKS + token mint), and
# the broker under test. No dependency on any external lab.
#
#   docker compose -f tests/stack/docker-compose.yml up -d --build
#   pytest tests/integration
#
# The `multi` profile (docker-compose.multi.yml) adds broker-a/b behind a
# round-robin nginx for the multi-replica proof.

services:
  openbao:
    image: openbao/openbao:2
    container_name: vtb-openbao
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    cap_add: ["IPC_LOCK"]
    ports:
      - "8210:8200"

  openbao-init:
    image: curlimages/curl:8.10.1
    container_name: vtb-openbao-init
    depends_on:
      - openbao
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_ROOT_TOKEN: root
      BROKER_VAULT_TOKEN: ${BROKER_VAULT_TOKEN:-vtb-dev-broker-token}
      MOCK_CLIENT_ID: ${MOCK_CLIENT_ID:-mcp-lab-broker}
      MOCK_CLIENT_SECRET: ${MOCK_CLIENT_SECRET:-mock-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./openbao-init/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]

  redis:
    image: redis:7-alpine
    container_name: vtb-redis
    ports:
      - "6390:6379"

  mock-vendor:
    build: ./mock-vendor
    container_name: vtb-mock-vendor
    environment:
      MOCK_PUBLIC_URL: http://localhost:8310
      MOCK_INTERNAL_URL: http://mock-vendor:8310
      MOCK_CLIENT_ID: ${MOCK_CLIENT_ID:-mcp-lab-broker}
      MOCK_CLIENT_SECRET: ${MOCK_CLIENT_SECRET:-mock-secret}
      MOCK_AT_TTL: "60"
    ports:
      - "8310:8310"

  hub-stub:
    build: ./hub-stub
    container_name: vtb-hub-stub
    environment:
      HUB_STUB_ISSUER: http://hub-stub:8320
    ports:
      - "8320:8320"

  broker:
    build:
      context: ../..
    container_name: vtb-broker
    environment:
      HUB_ISSUER: http://hub-stub:8320
      HUB_JWKS_URI: http://hub-stub:8320/jwks
      BROKER_PUBLIC_URL: http://localhost:8300
      VAULT_ADDR: http://openbao:8200
      VAULT_TOKEN: ${BROKER_VAULT_TOKEN:-vtb-dev-broker-token}
      REGISTRY_PATH: /app/registry.json
      COORD_BACKEND: ${COORD_BACKEND:-memory}
      REDIS_URL: redis://redis:6379/0
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    volumes:
      - ../../registry.example.json:/app/registry.json:ro
    ports:
      - "8300:8300"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      openbao-init:
        condition: service_completed_successfully
      mock-vendor:
        condition: service_started
      hub-stub:
        condition: service_started
      redis:
        condition: service_started
