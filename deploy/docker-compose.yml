# Single-replica deployment shape (COORD_BACKEND=memory).
#
# Expects, next to this file:
#   .env                a copy of ../.env.example with your values. Every
#                       variable in it reaches the broker, including the
#                       vendor client ids that enable registry vendors
#                       (enabled_env, e.g. GITHUB_CLIENT_ID) and knobs such
#                       as HUB_LOGIN_HINT=none for a real IdP.
#   registry.json       your reviewed vendor registry
#   broker-vault-token  a scoped custody token, never root (docs/operations.md).
#                       The image runs as UID 65534 and compose bind-mounts
#                       the file with its host owner and mode: on a Linux host
#                       a 0600 file is unreadable and startup fails with
#                       "VAULT_TOKEN_FILE unreadable". Make it readable by
#                       that user (chown 65534, or chmod 0444).
#
# The broker speaks plain HTTP on 8300. Terminate TLS in front of it and set
# BROKER_PUBLIC_URL to the https URL (the consent cookie is Secure only then).

services:
  broker:
    build: ..
    env_file: .env
    environment:
      # Paths inside the container; they override any value in .env.
      VAULT_TOKEN_FILE: /run/secrets/broker-vault-token
      REGISTRY_PATH: /app/registry.json
    volumes:
      - ./registry.json:/app/registry.json:ro
    secrets:
      - broker-vault-token
    ports:
      - "8300:8300"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8300/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3

secrets:
  broker-vault-token:
    file: ./broker-vault-token
